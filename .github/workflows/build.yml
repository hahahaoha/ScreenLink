name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 装 Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 生成 wrapper 并编译 debug 包
        run: |
          gradle wrapper --gradle-version 8.10.2
          ./gradlew assembleDebug --stacktrace

      - name: 给 APK 起个好名字
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ScreenLink-debug.apk
          ls -lh app/build/outputs/apk/debug/

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ScreenLink-debug
          path: app/build/outputs/apk/debug/ScreenLink-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 更新 latest 预发布（固定下载地址）
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ScreenLink 最新构建
          body: |
            由 GitHub Actions 自动构建的 debug 版 APK。

            固定下载地址：
            `https://github.com/hahahaoha/ScreenLink/releases/download/latest/ScreenLink-debug.apk`
          prerelease: true
          files: app/build/outputs/apk/debug/ScreenLink-debug.apk

      - name: 打 tag 时发正式 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/ScreenLink-debug.apk
          generate_release_notes: true
